name: Deploy GitHub Pages

on:
  push:
    branches:
      - main  # Change this if your branch is different

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'  # Use the required Python version

      - name: Create virtual environment
        run: python -m venv wxenv

      - name: Activate environment & Install dependencies
        run: |
          source wxenv/bin/activate
          pip install -r requirements.txt

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: _site  # Ensure this is the correct build output folder
