name: Deploy GitHub Pages

on:
  push:
    branches:
      - main  # Change this if your branch is different

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔹 Set up Python (Version 3.11.11)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11.11'

      - name: Create virtual environment
        run: python -m venv wxenv

      - name: Activate environment & Install dependencies
        run: |
          source wxenv/bin/activate
          pip install -r requirements.txt

      # 🔹 Set up Ruby & Jekyll
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'  # Adjust if needed for compatibility with GitHub Pages

      - name: Install Bundler & Jekyll (if Gemfile exists)
        run: |
          gem install bundler
          if [ -f Gemfile ]; then bundle install; fi

      # 🔹 Build the Jekyll site
      - name: Build Jekyll site
        run: bundle exec jekyll build

      # 🔹 Upload the generated site
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: _site  # Ensure this is the correct output folder
